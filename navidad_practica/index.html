<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navidad Mágica</title>

</head>

<body>
    <!-- Fondo árbol pantalla completa -->
    <div id="arbol">
        <div id="wrapper">
            <h1> &#x1F384; Bienvenido a la Navidad Mágica &#x1F384; </h1>
            <!-- Invitación a la fiesta solo visible con hover -->
            <div id="invitacion">&#x2728; Ven a mi fiesta el 25 &#x2728;</div>
            <!-- Descripción -->
            <div id="nota">
                Una noche especial llena de magia, nieve y sorpresas.<br>
                Acércate al árbol, descubre el mensaje y observa el trineo surcando el
                cielo.
            </div>
            <!-- Botón del villancico -->
            <button id="botonSonido">Activar / Parar villancico</button>
        </div>
    </div>
    <!-- Trineo por encima de todo -->
    <img id="trineo" src="./imagenes/trineo.gif" alt="Trineo de Papá Noel">
    <!-- Contenedor nieve -->
    <div id="nieve"></div>
    <!-- Reloj esquina inferior izquierda -->
    <div id="reloj"></div>
    <!-- Autor esquina inferior derecha -->
    <div id="autor">© Alejandro Guerra Abán y Brian Burgos Recuero</div>
    <!-- Audios -->
    <audio id="villancico" src="audio/villancico.mp3" loop></audio>
    <audio id="hoho" src="audio/hoho.mp3"></audio>
    <script src="script.js"></script>

</body>

</html>
